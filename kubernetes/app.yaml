apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: default
  labels:
    app: target-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
      - name: target-app
        image: ebpf-target-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres.default.svc.cluster.local:5432/checkout"
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: default
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: target-app
  type: ClusterIP
